<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaki Lima Midnight — a night-stall cooking game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17101f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kaki Lima Midnight: run a night food stall. Click an order ticket, click ingredients to send them to the chop board, wok, pot or plate, collect each step when it is ready, then serve the finished plate at the pass."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
